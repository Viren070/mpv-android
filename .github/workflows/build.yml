name: build

# Builds the AAR for arm64-v8a, armeabi-v7a and x86_64 from the sources
# buildscripts/include/depinfo.sh pins. A push to library also publishes it as
# a release, tagged with the date and commit.
on:
  push:
    branches: [library]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config ninja-build nasm
          pipx install meson==1.12.1

      - name: Build
        working-directory: buildscripts
        env:
          IN_CI: 1
          GRADLE_OPTS: -Xmx4G
        run: |
          unset ANDROID_SDK_ROOT
          ./download.sh >/dev/null
          ./buildall.sh --arch arm64 mpv
          ./buildall.sh --arch x86_64 mpv
          # armeabi-v7a, then the AAR with all three
          ./buildall.sh

      - name: Collect the AAR
        run: |
          tag="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "TAG=$tag" >>"$GITHUB_ENV"
          name="mpv-android-lib-$tag.aar"
          mkdir out
          cp lib/build/outputs/aar/lib-release.aar "out/$name"
          (cd out && sha256sum "$name" >"$name.sha256")
          cat out/*.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android-lib
          path: out
          compression-level: 0

      - name: Publish the release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/library'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Built from these sources:'
            echo
            sed -n 's/^v_\([a-z0-9_]*\)=\(.*\)$/- \1: \2/p' buildscripts/include/depinfo.sh
            echo
            echo 'SHA-256:'
            echo
            echo '```'
            cat out/*.sha256
            echo '```'
          } >notes.md
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
